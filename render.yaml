services:
  - type: web
    name: sanad-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    plan: free
    disk:
      name: sanad-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SANAD_ADMIN_TOKEN
        sync: false
      - key: SANAD_ALLOWED_ORIGINS
        sync: false
      - key: SANAD_COOKIE_SECURE
        value: "true"
      - key: SANAD_COOKIE_SAMESITE
        value: none
      - key: DATABASE_URL
        value: sqlite:////var/data/sanad.db
