name: SANAD Quality Checks

on:
  pull_request:
    branches: ["work/sanad-phase-1-foundation"]
  push:
    branches: ["fix/search-result-click"]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
