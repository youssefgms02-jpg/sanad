name: SANAD quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build application
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Exercise targeted support-data repair on CI copy
        working-directory: backend
        run: python repair_support_services_batch10.py
      - name: Audit tracked database (read-only)
        working-directory: backend
        run: |
          python audit_database.py
          python -c "import json; r=json.load(open('service_audit_report.json', encoding='utf-8')); print('DATABASE AUDIT SUMMARY:', json.dumps(r['counts'], ensure_ascii=False)); print('STATUS COUNTS:', json.dumps(r['by_status'], ensure_ascii=False)); print('REPEATED DETAIL CANDIDATES:', len(r['checks']['repeated_detail_text_candidates']))"
      - name: Upload database audit report
        uses: actions/upload-artifact@v4
        with:
          name: sanad-database-audit
          path: backend/service_audit_report.json
          if-no-files-found: error
