name: SANAD Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Android project and sync web assets
        env:
          SANAD_BUILD_VERSION: ${{ github.ref_name }}
          SANAD_BUILD_COMMIT: ${{ github.sha }}
          VITE_UPDATE_MANIFEST_URL: https://api.github.com/repos/youssefgms02-jpg/sanad/releases/latest
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "SANAD-${GITHUB_REF_NAME}-android.apk"

      - name: Upload Android APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanad-${{ github.ref_name }}-android
          path: SANAD-${{ github.ref_name }}-android.apk
          if-no-files-found: error

      - name: Attach Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SANAD ${{ github.ref_name }}
          body: "نسخة Android التجريبية القابلة للتثبيت من تطبيق سَنَد."
          draft: false
          prerelease: false
          files: SANAD-${{ github.ref_name }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
